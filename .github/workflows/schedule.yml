name: Daily AutoShorts Generation

on:
  schedule:
    # Run 5 times a day at specific hours UTC
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate_and_upload:
    runs-on: ubuntu-latest
    
    # Grant permissions to commit the updated SQLite history database back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create YouTube Credentials File
        run: |
          echo '${{ secrets.YOUTUBE_CREDENTIALS_JSON }}' > youtube_credentials.json

      - name: Run AutoShorts Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          YOUTUBE_CREDENTIALS_FILE: "youtube_credentials.json"
          LOG_LEVEL: "INFO"
        run: |
          PYTHONPATH=. python scripts/run_short.py --channel technology

      - name: Commit Updated History DB
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f autoshorts_history.db
          # Only commit if there are changes
          git diff-index --quiet HEAD || git commit -m "chore: update run history [skip ci]" && git push
